{% extends 'base.html' %}
{% load static %}

{% block title %}Новый пароль - WS{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h1>Новый пароль</h1>
        <p>Придумайте новый пароль для {{ user.email }}</p>
    </div>

    <div class="form-card">
        <form method="post" class="new-password-form">
            {% csrf_token %}
            
            {% if messages %}
            <div class="form-errors">
                {% for message in messages %}
                <div class="error-message">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="form-group">
                <label for="new_password1" class="form-label">Новый пароль</label>
                <input type="password" name="new_password1" id="new_password1" 
                       class="form-input" placeholder="Не менее 8 символов" required>
            </div>

            <div class="form-group">
                <label for="new_password2" class="form-label">Подтвердите пароль</label>
                <input type="password" name="new_password2" id="new_password2" 
                       class="form-input" placeholder="Повторите пароль" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-accent btn-large">
                    Сохранить пароль
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
