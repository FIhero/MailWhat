{% extends 'base.html' %}
{% load static %}

{% block title %}Сброс пароля - WS{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h1>Сброс пароля</h1>
        <p>Введите ваш email для получения кода подтверждения</p>
    </div>

    <div class="form-card">
        <form method="post" class="password-reset-form">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="form-errors">
                <div class="error-message">
                    Пожалуйста, исправьте ошибки ниже.
                </div>
            </div>
            {% endif %}

            <div class="form-group">
                <label for="id_email" class="form-label">Email адрес</label>
                <input type="email" name="email" id="id_email" class="form-input"
                       placeholder="your@email.com" required
                       value="{{ form.email.value|default:'' }}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-accent btn-large">
                    Получить код
                </button>
                <a href="{% url 'users:login' %}" class="btn btn-cancel">
                    Вернуться к входу
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
